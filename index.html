<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Great Guessing Game</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="h1">
            <span class="h1-small">The Great</span>
            <span id="colorDisplay"></span>
            <span class="h1-small">Guessing Game</span>
        </h1>

        <div id="stripe">
            <button id="reset">Nuevos Colores</button>
            <span id="message"></span>
            <button class="mode selected">Hard</button>
            <button class="mode">Easy</button>
        </div>

        <div id="scoreboard">
            <span class="score">Racha actual <strong id="streak">0</strong></span>
            <span class="score">Mejor racha <strong id="bestStreak">0</strong></span>
            <span class="score">Aciertos <strong id="wins">0</strong></span>
        </div>

        <div class="container">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <script src="colorgame.js"></script>
    </body>
</html>
